<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embed test: a page with a canvas</title>
<style>
  /* Styles of a host page. Some of them use the same names as the prototype, to show that they do not reach it. */
  body { margin: 0; font-family: Georgia, serif; background: #101418; color: #eee; }
  .btn { background: hotpink !important; font-size: 40px; }
  #panel, #settings { display: none !important; }
  button { border: 6px dashed red; }
  header, section { max-width: 900px; margin: 0 auto; padding: 48px 24px; }
  .stage { display: block; width: 100%; height: 620px; }
  .tall { height: 1400px; }
  :root { --section-space: clamp(24px, 4vw, 60px); }
</style>
</head>
<body>
<header><h1>A host page</h1><p>The canvas below has a size from the page: 100% wide, 620 px high.</p></header>
<canvas class="stage" id="planet" data-design-builds-worlds data-tier="medium" data-inset="var(--section-space)"></canvas>
<section class="tall"><h2>More page</h2><p>The page scrolls. The mouse wheel must scroll the page, also when the pointer is on the planet.</p></section>
<script src="../dist/design-builds-worlds.min.js"></script>
</body>
</html>
